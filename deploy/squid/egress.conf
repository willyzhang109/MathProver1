# Optional hardening: a localhost-only forward proxy with a one-hostname
# allowlist. This is the ONLY configuration in which IPAddressAllow means
# anything for the API service, because Gemini's address set is large and
# rotating so a literal IP allowlist is unmaintainable.
#
# With this running:
#   1. set  HTTPS_PROXY=http://127.0.0.1:3128  in /etc/mathprover/server.env
#   2. replace the IPAddressDeny line in the unit with:
#        IPAddressDeny=any
#        IPAddressAllow=localhost
#
# Note elan, `lake exe cache get` and `git pull` all need general egress and
# should be run at provisioning time as a different user.

http_port 127.0.0.1:3128

acl allowed_hosts dstdomain generativelanguage.googleapis.com
acl allowed_hosts dstdomain .googleapis.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !allowed_hosts
http_access deny CONNECT !SSL_ports
http_access allow allowed_hosts
http_access deny all

forwarded_for delete
via off
