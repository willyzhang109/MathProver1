# /etc/nginx/sites-available/mathprover
#
# A domain name is mandatory: GitHub Pages is HTTPS, so a plain-HTTP or
# bare-IP API is blocked by the browser as mixed content, and Let's Encrypt
# will not issue a certificate for an IP address.

limit_req_zone $binary_remote_addr zone=mathprover_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 256k;

    location /api/ {
        limit_req zone=mathprover_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # $proxy_add_x_forwarded_for APPENDS the peer nginx actually sees, so
        # the rightmost entry is always the true client. server/clientip.py
        # walks the chain right-to-left and takes the first untrusted address,
        # which is what makes a client-supplied prefix unspoofable.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        proxy_read_timeout 65s;
    }

    # CORS is emitted by FastAPI; do not add it here or headers get duplicated.
}
